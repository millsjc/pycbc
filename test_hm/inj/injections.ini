[injections]
; time-interval = 25
; time-step = 10
; taper-injection = start
; seed = 1234
; [prior]
; i-distr = uniform
; l-distr = random
; enable-spin =
; aligned =
; min-spin1 = 0
; max-spin1 = 0.99
; min-spin2 = 0
; max-spin2 = 0.99
; dchirp-distr = uniform
; m-distr = totalMassRatio
; min-distance = 1000
; max-distance = 300000
; min-mtotal = 100
; max-mtotal = 600
; min-mratio = 1
; max-mratio = 20
; ; waveform = IMRPhenomXHM
; ; taper-injection = start
; ; seed = 123407
; f-lower = 10

[variable_params]
; waveform parameters that will vary in MCMC
; delta_tc =
; mass1 =
mtotal = 
; mass2 =
mratio = 
spin1_a =
spin1_azimuthal =
spin1_polar =
spin2_a =
spin2_azimuthal =
spin2_polar =
chirp_distance =
coa_phase =
inclination =
polarization =
ra =
dec =

[static_params]
; waveform parameters that will not change in MCMC
approximant = IMRPhenomXHM
f_lower = 10
f_ref = 20

[prior-mtotal]
name = uniform
min-mtotal = 100
max-mtotal = 600

[prior-mratio]
name = uniform
min-mratio = 1
max-mratio = 20

[prior-spin1_a]
name = uniform
min-spin1_a = 0.0
max-spin1_a = 0.99

[prior-spin1_polar+spin1_azimuthal]
name = uniform_solidangle
polar-angle = spin1_polar
azimuthal-angle = spin1_azimuthal

[prior-spin2_a]
name = uniform
min-spin2_a = 0.0
max-spin2_a = 0.99

[prior-spin2_polar+spin2_azimuthal]
name = uniform_solidangle
polar-angle = spin2_polar
azimuthal-angle = spin2_azimuthal

; The waveform generator expects spins to be in cartesian coordinates, with
; names spin(1|2)(x|y|z). We therefore need to provide a waveform transform
; that converts the spherical coordinates that we have defined the spin prior
; in to cartesian coordinates.
[waveform_transforms-spin1x+spin1y+spin1z]
name = spherical_to_cartesian
x = spin1x
y = spin1y
z = spin1z
radial = spin1_a
polar = spin1_polar
azimuthal = spin1_azimuthal

[waveform_transforms-spin2x+spin2y+spin2z]
name = spherical_to_cartesian
x = spin2x
y = spin2y
z = spin2z
radial = spin2_a
polar = spin2_polar
azimuthal = spin2_azimuthal

[waveform_transforms-mass1]
name = custom
inputs = mtotal,mratio
mass1 = mass1_from_mtotal_q(mtotal,mratio)

[waveform_transforms-mass2]
name = custom
inputs = mtotal,mratio
mass2 = mass2_from_mtotal_q(mtotal,mratio)

[waveform_transforms-mchirp]
name = custom
inputs = mass1,mass2
mchirp = mchirp_from_mass1_mass2(mass1,mass2)

[prior-chirp_distance]
name = uniform
min-chirp_distance = 1
max-chirp_distance = 200

[waveform_transforms-distance]
name = chirp_distance_to_distance

[prior-coa_phase]
; coalescence phase prior
name = uniform_angle

[prior-inclination]
; inclination prior
name = sin_angle

[prior-ra+dec]
; sky position prior
name = uniform_sky

[prior-polarization]
; polarization prior
name = uniform_angle
